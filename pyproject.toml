[project]
name = "fingerprints"
version = "0.1.0"
description = "Comparing classical and neural molecular fingerprints"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rdkit>=2024.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "polars>=1.20",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "loguru>=0.7",
    "typeguard>=4.3",
    "dataframely>=1.4",
    "joblib>=1.4",
    "torch>=2.6",
    "transformers>=4.51",
    "safetensors>=0.5",
    "pillow>=11",
    "requests>=2.32",
    # neural fingerprint models
    "chemprop>=2.2.0",
    "smirk>=0.2",
    # for ChEMBL parsing
    "chembl_downloader>=0.5",
    # low-dim embedding + density clustering for the cluster/ADME figures
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "marimo>=0.24.0",
    "altair>=6.2.2",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "anywidget>=0.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ipython>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerprints"]
